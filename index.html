<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta
      name="description"
      content="面向中文母语者的 60 分钟日语生存口语训练，包含场景对话、跟读、角色扮演和进度记录。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="口语六十" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="192x192" href="./app-icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>口语六十 · 日语日常口语</title>
  </head>
  <body>
    <div class="app-shell" id="app">
      <header class="app-header" id="app-header">
        <button class="brand-button" type="button" data-route="home" aria-label="回到今日练习">
          <span class="brand-mark" aria-hidden="true">話</span>
          <span class="brand-copy">
            <strong>口语六十</strong>
            <small>日本語、毎日ひとこと。</small>
          </span>
        </button>
        <button class="icon-button install-trigger" id="install-button" type="button" hidden aria-label="安装应用">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" />
          </svg>
        </button>
      </header>

      <main class="app-main" id="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-route="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" />
          </svg>
          <span>今天</span>
        </button>
        <button class="nav-item" type="button" data-route="course">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zm16 0A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z" />
          </svg>
          <span>课程</span>
        </button>
        <button class="nav-item" type="button" data-route="phrasebook">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h10a3 3 0 0 1 3 3v14H8a3 3 0 0 1-3-3zm3 4h7m-7 4h7m-7 4h4" />
          </svg>
          <span>句库</span>
        </button>
        <button class="nav-item" type="button" data-route="progress">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20V10m7 10V4m7 16v-7" />
          </svg>
          <span>进度</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
